# MapNet PROD front (:8088) — dedicated nginx instance.
#
# Serves the MapLibre user-facing map (static) and reverse-proxies:
#   /tiles/            -> pg_tileserv        (127.0.0.1:7800)  vector tiles
#   /api/v1/places/    -> Go gateway         (127.0.0.1:8080)  places API
#   /api/              -> Python DDD backend (127.0.0.1:9088)  captures/stats/routing
#   /                  -> static index.html + app.js (MapLibre PROD UI)
#
# Run standalone (does NOT touch the system nginx):
#   nginx -c /home/ubuntu/webapp/MORNINGSTAR/MAPNET/deploy/nginx/mapnet-prod.conf
#
# NOTE: no secrets here. Upstream ports are configurable via the systemd unit /
# start script environment; nginx itself only needs host:port, never DB creds.

worker_processes 1;
pid /home/ubuntu/webapp/MORNINGSTAR/MAPNET/deploy/logs/mapnet-nginx.pid;
error_log /home/ubuntu/webapp/MORNINGSTAR/MAPNET/deploy/logs/mapnet-nginx-error.log warn;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    access_log /home/ubuntu/webapp/MORNINGSTAR/MAPNET/deploy/logs/mapnet-nginx-access.log;

    # temp paths inside the project so the unprivileged instance never touches
    # the system nginx spool dirs.
    client_body_temp_path /home/ubuntu/webapp/MORNINGSTAR/MAPNET/deploy/logs/nginx-client-body;
    proxy_temp_path       /home/ubuntu/webapp/MORNINGSTAR/MAPNET/deploy/logs/nginx-proxy;
    fastcgi_temp_path     /home/ubuntu/webapp/MORNINGSTAR/MAPNET/deploy/logs/nginx-fastcgi;
    uwsgi_temp_path       /home/ubuntu/webapp/MORNINGSTAR/MAPNET/deploy/logs/nginx-uwsgi;
    scgi_temp_path        /home/ubuntu/webapp/MORNINGSTAR/MAPNET/deploy/logs/nginx-scgi;

    # gzip vector-tile + json payloads (pbf is already compact; still helps json)
    gzip on;
    gzip_types application/json application/javascript text/css application/x-protobuf;
    gzip_min_length 512;

    upstream mapnet_tiles   { server 127.0.0.1:7800; keepalive 16; }
    upstream mapnet_gateway { server 127.0.0.1:8080; keepalive 16; }
    upstream mapnet_backend { server 127.0.0.1:9088; keepalive 16; }

    server {
        listen 0.0.0.0:8088;
        server_name _;

        root /home/ubuntu/webapp/MORNINGSTAR/MAPNET/backend/presentation/static;
        index index.html;

        # ---- Vector tiles (pg_tileserv) ----
        location /tiles/ {
            proxy_pass http://mapnet_tiles/;   # strip the /tiles/ prefix
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=3600";
        }

        # ---- Places API (Go gateway keeps the full /api/v1/places prefix) ----
        location /api/v1/places/ {
            proxy_pass http://mapnet_gateway;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        # ---- Everything else under /api/ -> Python DDD backend ----
        #      (captures, stats, map.geojson, routing/*, agents, position, devices)
        location /api/ {
            proxy_pass http://mapnet_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_read_timeout 60s;   # routing/alternatives can take a few seconds
        }

        # ---- Static PROD UI ----
        location = /app.js {
            add_header Cache-Control "no-cache";
            try_files /app.js =404;
        }
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
