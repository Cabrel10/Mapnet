name: mapnet_mobile_client
description: >
  MapNet Navigation — carte, recherche Cameroun, itinéraires guidés et moteur
  Offline-First / DTN avec synchronisation différentielle de la Gateway Go.
publish_to: "none"
version: 1.3.1+5

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  connectivity_plus: ^6.0.5
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^12.0.0
  flutter_compass: ^0.8.0
  sensors_plus: ^6.1.1
  sqflite: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
