<!DOCTYPE html>
<!-- MAPNET — browser test console
     Repository: github.com/Cabrel10/Mapnet
     Served by the Go gateway (single origin, no CORS). All API calls are
     relative and reverse-proxied by the gateway:
       /api/gps/*  -> gps-collect (GPX upload)
       /api/map/*  -> map-engine  (edges GeoJSON + versioned sync) -->
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MAPNET — Console carte</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  * { box-sizing: border-box; }
  html,body { margin:0; height:100%; font-family: system-ui, sans-serif; }
  #app { display:flex; height:100%; }
  #map { flex:1; }
  #panel { width:340px; background:#0f172a; color:#e2e8f0; padding:14px; overflow-y:auto; }
  h1 { font-size:16px; margin:0 0 10px; color:#38bdf8; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:#94a3b8; margin:16px 0 6px; }
  button { background:#2563eb; color:#fff; border:0; border-radius:6px; padding:8px 12px; cursor:pointer; font-size:13px; margin:2px 0; }
  button:hover { background:#1d4ed8; }
  input,select { width:100%; padding:7px; border-radius:6px; border:1px solid #334155; background:#1e293b; color:#e2e8f0; margin:3px 0; }
  .metric { display:flex; justify-content:space-between; font-size:12px; padding:3px 0; border-bottom:1px solid #1e293b; }
  .metric b { color:#4ade80; }
  pre { background:#020617; padding:8px; border-radius:6px; font-size:11px; max-height:180px; overflow:auto; white-space:pre-wrap; }
  .ok { color:#4ade80; } .err { color:#f87171; }
  .row { display:flex; gap:6px; } .row button { flex:1; }
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>
  <div id="panel">
    <h1>MAPNET — Console carte</h1>

    <h2>Couche edges (routes détectées)</h2>
    <div class="row">
      <button onclick="loadEdges()">Charger edges</button>
      <button onclick="fitEdges()">Zoom edges</button>
    </div>
    <label style="font-size:12px;display:flex;align-items:center;gap:6px;margin-top:6px">
      <input type="checkbox" id="autoSync" checked style="width:auto" />
      Sync automatique (manifest/delta, sans recharger)
    </label>

    <h2>Upload GPX</h2>
    <input type="file" id="gpxFile" accept=".gpx" />
    <input id="driver" value="browser-test" />
    <button onclick="uploadGPX()">Envoyer GPX</button>

    <h2>Itinéraire (position → destination)</h2>
    <div class="row">
      <button onclick="useMyPosition()">📍 Ma position (GPS)</button>
      <button onclick="armOrigin()">📌 Position par clic</button>
      <button onclick="armDestination()">🎯 Poser destination</button>
    </div>
    <div class="row">
      <button onclick="clearRoute()">Effacer itinéraire</button>
    </div>
    <div id="routeSummary" style="font-size:13px;margin:6px 0"></div>
    <div id="routeSteps" style="font-size:12px"></div>

    <h2>Agents en direct</h2>
    <div class="row">
      <button onclick="toggleAgents()" id="agentsBtn">👥 Agents (0)</button>
      <button onclick="loadAgents()">Rafraîchir</button>
    </div>
    <div id="agentsList" style="font-size:12px"></div>

    <h2>Synchronisation versionnée</h2>
    <div class="row">
      <button onclick="manifest()">Manifest</button>
      <button onclick="delta()">Delta (since 0)</button>
    </div>

    <h2>Métriques (latence / volume)</h2>
    <div id="metrics"></div>

    <h2>Journal</h2>
    <pre id="log"></pre>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
// Same-origin relative paths — the Go gateway reverse-proxies these.
const gps = () => '/api/gps';
const mep = () => '/api/map';
function log(msg, cls){ const p=$('log'); p.innerHTML = `<span class="${cls||''}">${new Date().toLocaleTimeString()} ${msg}</span>\n` + p.innerHTML; }
function metric(k,v){ $('metrics').insertAdjacentHTML('afterbegin', `<div class="metric"><span>${k}</span><b>${v}</b></div>`); }

const map = new maplibregl.Map({
  container: 'map',
  style: {
    version: 8,
    sources: { osm: { type:'raster', tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'], tileSize:256, attribution:'© OpenStreetMap' } },
    layers: [{ id:'osm', type:'raster', source:'osm' }]
  },
  center: [11.5021, 3.848], zoom: 13
});
map.addControl(new maplibregl.NavigationControl(), 'top-right');

// Timed fetch that records latency + payload size (bandwidth / bottleneck test).
async function timedFetch(label, url, opts){
  const t0 = performance.now();
  const res = await fetch(url, opts);
  const buf = await res.arrayBuffer();
  const ms = (performance.now() - t0).toFixed(1);
  const kb = (buf.byteLength/1024).toFixed(2);
  metric(`${label} latence`, `${ms} ms`);
  metric(`${label} volume`, `${kb} KB`);
  log(`${label}: ${res.status} en ${ms} ms, ${kb} KB`, res.ok?'ok':'err');
  return { res, text: new TextDecoder().decode(buf) };
}

async function loadEdges(){
  try {
    const { res, text } = await timedFetch('edges.geojson', `${mep()}/api/v1/map/edges.geojson`);
    // keep track of current head so auto-sync knows the baseline
    if(res.ok){ try { window._mapVersion = (await (await fetch(`${mep()}/api/v1/sync/manifest`)).json()).versions.map; } catch(e){} }
    if(!res.ok){ return; }
    const fc = JSON.parse(text);
    if(map.getLayer('edges-line')) map.removeLayer('edges-line');
    if(map.getLayer('edges-pt')) map.removeLayer('edges-pt');
    if(map.getSource('edges')) map.removeSource('edges');
    map.addSource('edges', { type:'geojson', data: fc });
    map.addLayer({ id:'edges-line', type:'line', source:'edges',
      paint:{ 'line-color':['match',['get','status'],'validated','#22c55e','non_cartographie_osm','#f97316','#94a3b8'], 'line-width':5 } });
    log(`edges chargés: ${fc.features.length} features`, 'ok');
    metric('edges features', fc.features.length);
    window._edges = fc;
  } catch(e){ log('loadEdges err: '+e, 'err'); }
}

function fitEdges(){
  const fc = window._edges;
  if(!fc || !fc.features.length){ log('aucun edge chargé','err'); return; }
  const b = new maplibregl.LngLatBounds();
  fc.features.forEach(f => (f.geometry.coordinates||[]).forEach(c => b.extend(c)));
  map.fitBounds(b, { padding: 60 });
}

async function uploadGPX(){
  const f = $('gpxFile').files[0];
  if(!f){ log('choisir un fichier GPX','err'); return; }
  const fd = new FormData();
  fd.append('file', f); fd.append('chauffeur_id', $('driver').value);
  try {
    const { res, text } = await timedFetch('upload GPX', `${gps()}/api/v1/collecte/gpx/upload`, { method:'POST', body: fd });
    log('réponse: '+text, res.ok?'ok':'err');
    setTimeout(loadEdges, 4000); // let the pipeline produce the edge
  } catch(e){ log('upload err: '+e, 'err'); }
}

async function manifest(){
  const { text } = await timedFetch('manifest', `${mep()}/api/v1/sync/manifest`);
  log('manifest: '+text, 'ok');
}
async function delta(){
  const { text } = await timedFetch('delta', `${mep()}/api/v1/sync/delta?since=0`);
  const d = JSON.parse(text);
  log(`delta: ${d.count} changements, head=${d.head}`, 'ok');
}

// ──────────────────────────────────────────────────────────────────────────
// Itinéraire guidé : position -> destination (via gateway /api/route/*)
// ──────────────────────────────────────────────────────────────────────────
const rte = () => '/api/route';
let _origin = null;          // {lat, lon}
let _destination = null;     // {lat, lon}
let _armDest = false;        // prochain clic carte = destination
let _armOrigin = false;      // prochain clic carte = origine (fallback HTTP sans HTTPS)
let _markers = [];
let _destMarker = null;
let _originMarker = null;
let _navWatchId = null;

function _fmtDist(m){ return m >= 1000 ? (m/1000).toFixed(1)+' km' : Math.round(m)+' m'; }
function _fmtDur(s){ const min = Math.round(s/60); return min >= 60 ? Math.floor(min/60)+' h '+(min%60)+' min' : min+' min'; }

function _setOrigin(lat, lon, source){
  _origin = { lat, lon };
  log(`position acquise (${source}): ${lat.toFixed(5)}, ${lon.toFixed(5)}`, 'ok');
  if(_originMarker) _originMarker.remove();
  const el = document.createElement('div');
  el.style.cssText = 'width:16px;height:16px;border-radius:50%;background:#2563eb;border:3px solid #fff;box-shadow:0 0 8px #2563eb';
  _originMarker = new maplibregl.Marker(el).setLngLat([lon, lat]).addTo(map);
  map.flyTo({ center: [lon, lat], zoom: 15 });
  if(_destination) computeRoute();
}

function useMyPosition(){
  if(!navigator.geolocation){ log('geolocalisation non supportee — utilisez "Position par clic"','err'); return; }
  navigator.geolocation.getCurrentPosition(
    pos => _setOrigin(pos.coords.latitude, pos.coords.longitude, 'GPS'),
    err => log('geoloc bloquee ('+err.message+') — page en HTTP simple. Utilisez "Position par clic".', 'err'),
    { enableHighAccuracy: true, timeout: 8000 });
}

function armOrigin(){
  _armOrigin = true; _armDest = false;
  log('cliquez sur la carte pour poser VOTRE position', 'ok');
  map.getCanvas().style.cursor = 'crosshair';
}

function armDestination(){
  _armDest = true; _armOrigin = false;
  log('cliquez sur la carte pour poser la destination', 'ok');
  map.getCanvas().style.cursor = 'crosshair';
}

map.on('click', e => {
  if(_armOrigin){
    _armOrigin = false;
    map.getCanvas().style.cursor = '';
    _setOrigin(e.lngLat.lat, e.lngLat.lng, 'clic carte');
    return;
  }
  if(!_armDest) return;
  _armDest = false;
  map.getCanvas().style.cursor = '';
  _destination = { lat: e.lngLat.lat, lon: e.lngLat.lng };
  if(_destMarker) _destMarker.remove();
  _destMarker = new maplibregl.Marker({ color: '#ef4444' }).setLngLat([_destination.lon, _destination.lat]).addTo(map);
  log(`destination posee: ${_destination.lat.toFixed(5)}, ${_destination.lon.toFixed(5)}`, 'ok');
  if(_origin) computeRoute();
  else log('position inconnue — cliquez "Ma position (GPS)" ou "Position par clic" d\'abord', 'err');
});

const ROUTE_COLORS = ['#2563eb', '#16a34a', '#f59e0b', '#9333ea'];
let _altRoutes = [];   // layers IDs des itinéraires alternatifs

function _badgeHtml(b){
  let s = '';
  if(b.has_unpaved) s += '<span style="background:#f59e0b;color:#000;border-radius:6px;padding:1px 6px;font-size:11px;margin-left:4px">piste non bitumée</span>';
  if(b.has_construction) s += '<span style="background:#ef4444;color:#fff;border-radius:6px;padding:1px 6px;font-size:11px;margin-left:4px">chantier</span>';
  if(b.secondary_m > 0 && b.total_m > 0){
    const pct = Math.round(100 * b.secondary_m / b.total_m);
    s += `<span style="background:#64748b;color:#fff;border-radius:6px;padding:1px 6px;font-size:11px;margin-left:4px">secondaire ${_fmtDist(b.secondary_m)} (${pct}%)</span>`;
  }
  if(!s){
    if(b.surface_known) s = '<span style="background:#16a34a;color:#fff;border-radius:6px;padding:1px 6px;font-size:11px;margin-left:4px">voie praticable</span>';
    else s = '<span style="background:#475569;color:#fff;border-radius:6px;padding:1px 6px;font-size:11px;margin-left:4px">surface inconnue</span>';
  }
  return s;
}

function _stepsHtml(steps){
  if(!steps || !steps.length) return '<div style="padding:2px 0;font-size:12px;color:#94a3b8">pas de détail étape par étape</div>';
  return steps.map(s => {
    const rp = (s.maneuver === 'roundabout' || s.maneuver === 'rotary');
    const icon = rp ? '&#10227;' : '&bull;';
    const dist = s.distance ? ` — ${_fmtDist(s.distance)}` : '';
    return `<div style="padding:2px 0;font-size:12px;${rp ? 'color:#f59e0b;font-weight:600' : ''}">${icon} ${s.instruction}${dist}</div>`;
  }).join('');
}

async function computeRoute(){
  if(!_origin || !_destination) return;
  try {
    const { res, text } = await timedFetch('alternatives', `${rte()}/api/v1/routing/alternatives`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ from_lat:_origin.lat, from_lon:_origin.lon, to_lat:_destination.lat, to_lon:_destination.lon, count:4 })
    });
    if(!res.ok){ log('alternatives: '+text, 'err'); return; }
    const data = JSON.parse(text);
    if(!data.routes || !data.routes.length){ log('aucun itineraire', 'err'); return; }
    drawAlternatives(data.routes);
  } catch(e){ log('alternatives err: '+e, 'err'); }
}

function _clearAltLayers(){
  _altRoutes.forEach(id => {
    if(map.getLayer(id)) map.removeLayer(id);
    if(map.getSource(id)) map.removeSource(id);
  });
  _altRoutes = [];
  if(map.getLayer('route-line')) map.removeLayer('route-line');
  if(map.getLayer('route-casing')) map.removeLayer('route-casing');
  if(map.getSource('route')) map.removeSource('route');
}

function drawAlternatives(routes){
  _clearAltLayers();
  const b = new maplibregl.LngLatBounds();
  let summaryHtml = '';

  routes.forEach((rt, idx) => {
    const color = ROUTE_COLORS[idx % ROUTE_COLORS.length];
    const sid = `route-alt-${idx}`;
    map.addSource(sid, { type:'geojson', data:{ type:'Feature', properties:{}, geometry: rt.geometry } });
    map.addLayer({ id:sid, type:'line', source:sid,
      paint:{ 'line-color':color, 'line-width': idx===0?6:4, 'line-opacity': idx===0?0.95:0.55 } });
    _altRoutes.push(sid);
    rt.geometry.coordinates.forEach(c => b.extend(c));
    const card = (rt.cardinal && rt.cardinal.bearing)
      ? `<span style="background:#0e7490;color:#fff;border-radius:6px;padding:1px 6px;font-size:11px;margin-left:4px">&#10148; ${rt.cardinal.bearing}</span>` : '';
    summaryHtml += `<div style="padding:3px 0;cursor:pointer" data-alt="${idx}">` +
      `<b style="color:${color}">&#9679;</b> ${_fmtDist(rt.distance)} — ${_fmtDur(rt.duration)}${card} ${_badgeHtml(rt.badges||{})}</div>`;
  });

  map.fitBounds(b, { padding: 80 });
  $('routeSummary').innerHTML = summaryHtml;
  $('routeSteps').innerHTML = _stepsHtml(routes[0].steps);
  $('routeSummary').querySelectorAll('[data-alt]').forEach(el => {
    el.onclick = () => {
      const sel = +el.dataset.alt;
      _altRoutes.forEach((id, k) => map.setPaintProperty(id, 'line-width', k===sel?6:4));
      _altRoutes.forEach((id, k) => map.setPaintProperty(id, 'line-opacity', k===sel?0.95:0.55));
      const bb = new maplibregl.LngLatBounds();
      routes[sel].geometry.coordinates.forEach(c => bb.extend(c));
      map.fitBounds(bb, { padding: 80 });
      $('routeSteps').innerHTML = _stepsHtml(routes[sel].steps);
    };
  });
  log(`itineraires: ${routes.length} alternatives (principal ${_fmtDist(routes[0].distance)})`, 'ok');
  metric('route distance', _fmtDist(routes[0].distance));
  metric('route duree', _fmtDur(routes[0].duration));
}

function drawRoute(route){
  // Polyline GeoJSON directement dessinable
  if(map.getLayer('route-line')) map.removeLayer('route-line');
  if(map.getLayer('route-casing')) map.removeLayer('route-casing');
  if(map.getSource('route')) map.removeSource('route');
  map.addSource('route', { type:'geojson', data:{ type:'Feature', properties:{}, geometry: route.geometry } });
  map.addLayer({ id:'route-casing', type:'line', source:'route',
    paint:{ 'line-color':'#0f172a', 'line-width':8, 'line-opacity':0.6 } });
  map.addLayer({ id:'route-line', type:'line', source:'route',
    paint:{ 'line-color':'#2563eb', 'line-width':5 } });

  // Zoom sur l'itinéraire
  const b = new maplibregl.LngLatBounds();
  route.geometry.coordinates.forEach(c => b.extend(c));
  map.fitBounds(b, { padding: 80 });

  // Résumé + étapes
  $('routeSummary').innerHTML = `<b style="color:#4ade80">${_fmtDist(route.distance)} — ${_fmtDur(route.duration)}</b> (${route.steps.length} etapes)`;
  $('routeSteps').innerHTML = '<ol style="margin:4px 0;padding-left:20px;max-height:200px;overflow-y:auto">' +
    route.steps.map(s => `<li style="padding:2px 0">${s.instruction} <span style="color:#64748b">(${_fmtDist(s.distance)})</span></li>`).join('') +
    '</ol>';
  log(`itineraire: ${_fmtDist(route.distance)}, ${_fmtDur(route.duration)}, ${route.steps.length} etapes`, 'ok');
  metric('route distance', _fmtDist(route.distance));
  metric('route duree', _fmtDur(route.duration));
}

function clearRoute(){
  _clearAltLayers();
  if(_destMarker){ _destMarker.remove(); _destMarker = null; }
  if(_originMarker){ _originMarker.remove(); _originMarker = null; }
  _markers.forEach(m => m.remove()); _markers = [];
  _origin = null; _destination = null; _armOrigin = false; _armDest = false;
  if(_navWatchId !== null){ navigator.geolocation.clearWatch(_navWatchId); _navWatchId = null; }
  $('routeSummary').innerHTML = ''; $('routeSteps').innerHTML = '';
  log('itineraire efface', 'ok');
}

// ──────────────────────────────────────────────────────────────────────────
// Agents en direct (via gateway /api/gps/api/v1/positions)
// ──────────────────────────────────────────────────────────────────────────
let _showAgents = false;
let _agentMarkers = [];
let _agentTimer = null;

async function loadAgents(){
  try {
    const { res, text } = await timedFetch('agents', `${gps()}/api/v1/positions?minutes=30`);
    if(!res.ok){ log('agents: '+text, 'err'); return; }
    const data = JSON.parse(text);
    _agentMarkers.forEach(m => m.remove());
    _agentMarkers = [];
    if(_showAgents){
      data.agents.forEach(a => {
        const el = document.createElement('div');
        el.style.cssText = 'background:#16a34a;color:#fff;font-size:10px;padding:3px 6px;border-radius:10px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5);white-space:nowrap';
        el.textContent = '👤 ' + a.agent_id;
        _agentMarkers.push(new maplibregl.Marker(el).setLngLat([a.lon, a.lat])
          .setPopup(new maplibregl.Popup().setText(`${a.agent_id} — ${new Date(a.timestamp).toLocaleTimeString()}`))
          .addTo(map));
      });
    }
    $('agentsBtn').textContent = `👥 Agents (${data.count})`;
    $('agentsList').innerHTML = data.agents.map(a =>
      `<div class="metric"><span>${a.agent_id}</span><b>${a.lat.toFixed(4)}, ${a.lon.toFixed(4)}</b></div>`).join('');
  } catch(e){ log('agents err: '+e, 'err'); }
}

function toggleAgents(){
  _showAgents = !_showAgents;
  $('agentsBtn').style.background = _showAgents ? '#16a34a' : '#2563eb';
  if(_showAgents){
    loadAgents();
    _agentTimer = setInterval(loadAgents, 5000);
    log('suivi agents active (refresh 5s)', 'ok');
  } else {
    if(_agentTimer){ clearInterval(_agentTimer); _agentTimer = null; }
    _agentMarkers.forEach(m => m.remove()); _agentMarkers = [];
    $('agentsList').innerHTML = '';
    $('agentsBtn').textContent = '👥 Agents (0)';
    log('suivi agents desactive', 'ok');
  }
}

// Phase 4 — auto-refresh: poll the manifest; when map version grows, pull the
// delta and update the MapLibre source in place (no page reload).
let _syncing = false;
async function pollSync(){
  if(!$('autoSync').checked || _syncing) return;
  _syncing = true;
  try {
    const m = await (await fetch(`${mep()}/api/v1/sync/manifest`)).json();
    const head = m.versions.map;
    if(window._mapVersion === undefined){ window._mapVersion = head; }
    else if(head > window._mapVersion){
      const since = window._mapVersion;
      const { text } = await timedFetch('delta auto', `${mep()}/api/v1/sync/delta?since=${since}`);
      const d = JSON.parse(text);
      log(`nouvelle version carte ${since} -> ${head} : ${d.count} route(s) mise(s) à jour`, 'ok');
      window._mapVersion = head;
      // reload the full edge layer so new routes appear instantly
      await loadEdges();
      fitEdges();
    }
  } catch(e){ /* silent: upstream may be briefly busy */ }
  finally { _syncing = false; }
}
setInterval(pollSync, 3000);

map.on('load', loadEdges);
</script>
</body>
</html>
